# Sets up the Pages CMS dashboard (pagescms.org), where volunteers edit the site without code.

media:
  input: src/assets/photos
  output: /src/assets/photos
  rename: safe
  extensions: [jpg, jpeg, png, webp, avif, JPG, JPEG, PNG, WEBP, AVIF]

content:
  - name: settings
    label: Alert banner and site settings
    type: file
    path: src/content/settings.yml
    fields:
      - name: alert_on
        label: Show the alert banner
        description: Turn this on to show the red alert at the top of every page. Turn it off when it no longer applies.
        type: boolean
      - name: alert_message
        label: Alert message
        description: The phone number is added after this message automatically.
        type: text
      - name: phone
        label: Phone number
        description: "Written like (323) 662-2776"
        type: string
        required: true
      - name: email
        label: Email address
        type: string
        required: true
      - name: address_line_1
        label: Street address
        type: string
        required: true
      - name: address_line_2
        label: City, state, and ZIP
        type: string
        required: true
      - name: directions_url
        label: Get directions link
        type: string
        required: true
      - name: instagram_url
        label: Instagram link
        type: string
        required: true
      - name: instagram_handle
        label: Instagram name
        description: "Written like @bicicocina"
        type: string
        required: true
      - name: zeffy_url
        label: Zeffy donation link
        type: string
        required: true
      - name: venmo_url
        label: Venmo donation link
        type: string
        required: true
      - name: paypal_url
        label: PayPal donation link
        type: string
        required: true

  - name: hours
    label: Weekly hours
    type: file
    path: src/content/hours.yml
    fields:
      - name: days
        label: Days
        type: object
        list: true
        fields:
          - name: day
            label: Day
            type: string
            required: true
          - name: time
            label: Time
            description: "Written like 6 – 9 pm, or Closed"
            type: string
            required: true
          - name: note
            label: Note (optional)
            description: A short line shown under the time, like FTWNB night.
            type: string

  - name: photos
    label: Photos
    type: file
    path: src/content/photos.yml
    fields:
      # Each slot is written out in full. Pages CMS doesn't understand YAML
      # shortcuts here, and saving removes any slot it can't see.
      # Labels say the page and spot. Descriptions say what to shoot and
      # whether the photo shows on phones.
      - name: home_hero_rider
        label: "Home page · Top · Next to the word “Fun.”"
        description: "Shows on phones: yes (above the headline)."
        type: object
        fields:
          - { name: image, label: Photo, type: image, description: "Must be under 4 MB. Shrink big phone photos first (in Preview: Tools > Adjust Size, about 2000 pixels wide). Leave empty to show the labeled placeholder box." }
          - { name: alt, label: Alt text, type: string, required: true, description: "A short description for people who can't see the photo." }
      - name: home_hero_brakes
        label: "Home page · Top · Next to the word “Safe.”"
        description: "Shows on phones: yes."
        type: object
        fields:
          - { name: image, label: Photo, type: image, description: "Must be under 4 MB. Shrink big phone photos first (in Preview: Tools > Adjust Size, about 2000 pixels wide). Leave empty to show the labeled placeholder box." }
          - { name: alt, label: Alt text, type: string, required: true, description: "A short description for people who can't see the photo." }
      - name: home_hero_wheel
        label: "Home page · Top · Small circle near “Accessible.” (hidden on phones)"
        description: "It's cropped into a circle, so keep the subject in the middle. Shows on phones: NO. It only appears on tablets and computers."
        type: object
        fields:
          - { name: image, label: Photo, type: image, description: "Must be under 4 MB. Shrink big phone photos first (in Preview: Tools > Adjust Size, about 2000 pixels wide). Leave empty to show the labeled placeholder box." }
          - { name: alt, label: Alt text, type: string, required: true, description: "A short description for people who can't see the photo." }
      - name: home_open_shop
        label: "Home page · What we do · Open shop card"
        description: "The photo at the top of the first card. Shows on phones: yes."
        type: object
        fields:
          - { name: image, label: Photo, type: image, description: "Must be under 4 MB. Shrink big phone photos first (in Preview: Tools > Adjust Size, about 2000 pixels wide). Leave empty to show the labeled placeholder box." }
          - { name: alt, label: Alt text, type: string, required: true, description: "A short description for people who can't see the photo." }
      - name: home_project_bikes
        label: "Home page · What we do · Project bikes card"
        description: "The photo at the top of the middle card. The same photo works for the top of the Project bikes page. Shows on phones: yes."
        type: object
        fields:
          - { name: image, label: Photo, type: image, description: "Must be under 4 MB. Shrink big phone photos first (in Preview: Tools > Adjust Size, about 2000 pixels wide). Leave empty to show the labeled placeholder box." }
          - { name: alt, label: Alt text, type: string, required: true, description: "A short description for people who can't see the photo." }
      - name: home_volunteer
        label: "Home page · What we do · Volunteer with us card"
        description: "The photo at the top of the third card. Shows on phones: yes."
        type: object
        fields:
          - { name: image, label: Photo, type: image, description: "Must be under 4 MB. Shrink big phone photos first (in Preview: Tools > Adjust Size, about 2000 pixels wide). Leave empty to show the labeled placeholder box." }
          - { name: alt, label: Alt text, type: string, required: true, description: "A short description for people who can't see the photo." }
      - name: home_floor_ftwnb
        label: "Home page · From the shop floor · Large photo on the left"
        description: "The wide first photo in the row of three. Shows on phones: yes (the three photos stack)."
        type: object
        fields:
          - { name: image, label: Photo, type: image, description: "Must be under 4 MB. Shrink big phone photos first (in Preview: Tools > Adjust Size, about 2000 pixels wide). Leave empty to show the labeled placeholder box." }
          - { name: alt, label: Alt text, type: string, required: true, description: "A short description for people who can't see the photo." }
      - name: home_floor_parts
        label: "Home page · From the shop floor · Middle photo"
        description: "Shows on phones: yes."
        type: object
        fields:
          - { name: image, label: Photo, type: image, description: "Must be under 4 MB. Shrink big phone photos first (in Preview: Tools > Adjust Size, about 2000 pixels wide). Leave empty to show the labeled placeholder box." }
          - { name: alt, label: Alt text, type: string, required: true, description: "A short description for people who can't see the photo." }
      - name: home_floor_rebuilt
        label: "Home page · From the shop floor · Photo on the right"
        description: "Shows on phones: yes."
        type: object
        fields:
          - { name: image, label: Photo, type: image, description: "Must be under 4 MB. Shrink big phone photos first (in Preview: Tools > Adjust Size, about 2000 pixels wide). Leave empty to show the labeled placeholder box." }
          - { name: alt, label: Alt text, type: string, required: true, description: "A short description for people who can't see the photo." }
      - name: learn_hero
        label: "Learn to repair page · Top · Beside the title"
        description: "Shows on phones: yes (below the buttons)."
        type: object
        fields:
          - { name: image, label: Photo, type: image, description: "Must be under 4 MB. Shrink big phone photos first (in Preview: Tools > Adjust Size, about 2000 pixels wide). Leave empty to show the labeled placeholder box." }
          - { name: alt, label: Alt text, type: string, required: true, description: "A short description for people who can't see the photo." }
      - name: project_hero
        label: "Project bikes page · Top · Beside the title"
        description: "Shows on phones: yes (below the buttons)."
        type: object
        fields:
          - { name: image, label: Photo, type: image, description: "Must be under 4 MB. Shrink big phone photos first (in Preview: Tools > Adjust Size, about 2000 pixels wide). Leave empty to show the labeled placeholder box." }
          - { name: alt, label: Alt text, type: string, required: true, description: "A short description for people who can't see the photo." }
      - name: about_cooks
        label: "Our mission page · Who we are · Beside the text (photo or video)"
        description: "Paste a YouTube link to show a video here instead of the photo. If the video ever stops working, clear the link and save, and the photo shows again. Shows on phones: yes (below the text)."
        type: object
        fields:
          - { name: image, label: Photo, type: image, description: "If a video link is filled in below, the video shows instead of this photo. To show this photo, clear the video link." }
          - { name: alt, label: Alt text, type: string, required: true, description: "A short description for people who can't see the photo." }
          - { name: video, label: Video link (optional), type: string }
      - name: volunteer_hero
        label: "Volunteer page · Top · Beside the title"
        description: "Shows on phones: yes (below the buttons)."
        type: object
        fields:
          - { name: image, label: Photo, type: image, description: "Must be under 4 MB. Shrink big phone photos first (in Preview: Tools > Adjust Size, about 2000 pixels wide). Leave empty to show the labeled placeholder box." }
          - { name: alt, label: Alt text, type: string, required: true, description: "A short description for people who can't see the photo." }

  - name: supporters
    label: Supporters
    type: file
    path: src/content/supporters.yml
    fields:
      - name: neighborhood_councils
        label: Neighborhood councils
        type: object
        list: true
        fields:
          - name: name
            label: Name
            description: "Without the words Neighborhood Council, like Silver Lake"
            type: string
            required: true
      - name: individuals
        label: Individuals (each gets a special thanks band)
        type: object
        list: true
        fields:
          - name: name
            label: Name
            type: string
            required: true
          - name: location
            label: Location (optional)
            type: string
          - name: thanks
            label: What we're thanking them for
            type: text
            required: true
      - name: grants
        label: Other grants (optional, listed beside 4429 Fountain Ave)
        description: Metabolic Studio and the Bohnett Foundation are already named in the 4429 Fountain Ave text, so don't add them here.
        type: object
        list: true
        fields:
          - name: name
            label: Name
            type: string
            required: true
          - name: description
            label: Description
            type: text
            required: true

  - name: co_ops
    label: Other LA Co-Ops page
    type: file
    path: src/content/co-ops.yml
    fields:
      - name: lead
        label: Big intro text at the top
        type: text
        required: true
      - name: intro
        label: Smaller intro text under it
        type: text
        required: true
      - name: co_ops
        label: Co-ops
        description: Each one gets its own section on the page. Adding or removing one here does not change the map. Ask for help with that.
        type: object
        list: true
        fields:
          - name: name
            label: Name
            type: string
            required: true
          - name: where
            label: Small line above the name
            description: "Written like Mar Vista, Westside · Since 2007"
            type: string
            required: true
          - name: lead
            label: One-sentence summary
            type: text
            required: true
          - name: about
            label: Description
            type: text
            required: true
          - name: website_label
            label: Website button text
            description: "Written like Visit bikerowave.org"
            type: string
            required: true
          - name: website_url
            label: Website link
            description: Must start with https://
            type: string
            required: true
          - name: hours
            label: Hours (optional)
            description: Leave empty to hide the Hours box. Their hours change, so visitors are sent to their website instead.
            type: object
            list: true
            fields:
              - name: days
                label: Days
                description: "Written like Monday – Thursday"
                type: string
                required: true
              - name: time
                label: Time
                description: "Written like 6 – 9 pm, or Closed"
                type: string
                required: true
          - name: address
            label: Address
            description: The Get directions button uses this address automatically.
            type: string
            required: true
          - name: phone
            label: Phone number (optional)
            description: "Written like (310) 230-5236"
            type: string
          - name: email
            label: Email address (optional)
            type: string
          - name: instagram
            label: Instagram name (optional)
            description: "Written like @bikerowave"
            type: string
      - name: map_labels
        label: Names on the map
        description: The labels stay in the same spots on the map picture. If a co-op moves, ask for help updating the map.
        type: object
        fields:
          - { name: bikerowave, label: Westside label, type: string, required: true }
          - { name: kitchen, label: Our label, type: string, required: true }
          - { name: bike_oven, label: Northeast label, type: string, required: true }
      - name: map_description
        label: Map description for people who can't see it
        type: text
        required: true
      - name: map_caption
        label: Small caption under the map
        type: string
        required: true
      - name: search_description
        label: Search result description
        description: The short summary Google may show for this page.
        type: text
        required: true
