lead: There are other DIY bicycle repair collectives in LA. Bikerowave and Bike
  Oven are also volunteer run co-ops that will support you in performing your
  own repairs.
intro: Visit any of us! We all want to make sure folks are supported in becoming
  ride ready.
co_ops:
  - name: Bikerowave
    where: Mar Vista, Westside · Since 2007
    lead: An all-volunteer bike repair co-op serving the Westside since 2007.
    about: Bikerowave aims to make cycling accessible to everyone by providing
      affordable resources and education needed for anyone to work on bikes. They
      provide space, tools, and equipment in order to effectively teach people how
      to build, repair, and maintain their bicycles.
    website_label: Visit bikerowave.org
    website_url: https://bikerowave.org/
    hours: []
    address: 12255 Venice Blvd, Los Angeles, CA 90066
    phone: (310) 230-5236
    email: info@bikerowave.org
    instagram: "@bikerowave"
  - name: Bike Oven
    where: Highland Park, Northeast LA · Since 2005
    lead: A volunteer-run bicycle repair collective that started in a single car
      garage in Highland Park.
    about: Bike Oven is a co-op focused on teaching bike maintenance and repair.
      Visit them at their new Cypress Park home.
    website_label: Visit bike-oven.com
    website_url: https://bike-oven.com/
    hours: []
    address: 3706 N Figueroa St, Los Angeles, CA 90065
    phone: (323) 217-8454
    email: bikeoven2.0@gmail.com
