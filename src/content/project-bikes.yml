work_trade:
  lead: Support us in supporting you. Earn $15 off the cost of your project for every hour you help us with tasks like cleaning and organizing the shop.
  amount: $15 off
  unit: per hour of work trade
  example: For example, 4 hours of cleaning and organizing takes $60 off your project’s price.
  faq_answer: Yes. Please let a volunteer know you want to do work trade when first setting up a project. Every hour of work trade, like cleaning or organizing, takes $15 off your bike’s price.
